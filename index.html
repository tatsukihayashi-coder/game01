<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Arial Black',sans-serif;overflow:hidden;}
canvas{display:block;border-radius:12px;box-shadow:0 0 40px rgba(100,60,200,0.5);}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"><canvas id="ui" width="320" height="380"></canvas></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const ui=document.getElementById('ui'),ux=ui.getContext('2d');
const W=c.width=640,H=c.height=320,GROUND=H-60;

// ===== AUDIO =====
const AC=new AudioContext();
function note(f,t,d,type='square',vol=0.15){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.start(t);o.stop(t+d);
}
function playBGM(){
  const t=AC.currentTime;
  const melody=[262,294,330,349,392,349,330,294,262,0,392,440,494,523,494,440];
  melody.forEach((f,i)=>{if(f>0)note(f,t+i*0.18,0.15,'triangle',0.06);});
  const bass=[131,131,165,165,196,196,165,165,131,131,165,165,196,196,131,131];
  bass.forEach((f,i)=>{if(f>0)note(f,t+i*0.18,0.16,'sine',0.04);});
}
function playBGMFast(){
  const t=AC.currentTime;
  const melody=[523,587,659,698,784,698,659,587,523,0,784,880,988,1047,988,880];
  melody.forEach((f,i)=>{if(f>0)note(f,t+i*0.1,0.08,'triangle',0.07);});
  const bass=[262,262,330,330,392,392,330,330,262,262,330,330,392,392,262,262];
  bass.forEach((f,i)=>{if(f>0)note(f,t+i*0.1,0.09,'sine',0.05);});
}
function playSEJump(){const t=AC.currentTime;note(440,t,0.05,'square',0.1);note(660,t+0.05,0.08,'square',0.08);}
function playSECrouch(){const t=AC.currentTime;note(200,t,0.06,'square',0.08);}
function playSEDead(){const t=AC.currentTime;[440,330,220,165].forEach((f,i)=>note(f,t+i*0.1,0.09,'sawtooth',0.12));}
function playSEScore(){const t=AC.currentTime;[523,659,784].forEach((f,i)=>note(f,t+i*0.07,0.08,'triangle',0.1));}
function playSE5000(){
  const t=AC.currentTime;
  [523,659,784,1047].forEach((f,i)=>note(f,t+i*0.1,0.15,'triangle',0.14));
  [523,659,784,1047,1319].forEach((f,i)=>note(f,t+0.5+i*0.07,0.12,'square',0.1));
  for(let i=0;i<8;i++)note(100+i*10,t+0.9+i*0.04,0.04,'sawtooth',0.1);
  [784,1047,1319,1568].forEach((f,i)=>note(f,t+1.3+i*0.08,0.2,'triangle',0.12));
}
// 隠しコマンドSE
function playSESecret(){
  const t=AC.currentTime;
  [784,1047,1319,1568,2093].forEach((f,i)=>note(f,t+i*0.06,0.1,'triangle',0.12));
  note(2093,t+0.35,0.3,'sine',0.1);
}
function playSESpin(){
  const t=AC.currentTime;
  [523,659,784,659,523,392,330,392,523].forEach((f,i)=>note(f,t+i*0.05,0.07,'square',0.1));
}

let bgmTimer=null;
function startBGM(fast=false){
  if(bgmTimer)clearInterval(bgmTimer);
  if(fast){playBGMFast();bgmTimer=setInterval(playBGMFast,16*0.1*1000);}
  else{playBGM();bgmTimer=setInterval(playBGM,16*0.18*1000);}
}
function stopBGM(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}}

// ===== STATE =====
let state='idle',score=0,best=0,frame=0,speed=4,obstacles=[],clouds=[],particles=[];
let milestone1000=0,milestone5000Done=false,sunY=50;

// 隠しコマンド状態
let secretMode=null; // 'hyperjump' | 'spin' | 'rainbow'
let secretTimer=0;
let spinAngle=0;
let rainbowHue=0;

const G={x:90,y:GROUND,w:38,h:90,vy:0,jumping:false,crouching:false,jumpCount:0,normalH:90,crouchH:50};

// ===== INPUT =====
const keys={};
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(AC.state==='suspended')AC.resume();
  keys[e.code]=true;

  if(state==='idle'||state==='dead'){startGame();return;}

  if(e.code==='ArrowUp'&&G.jumpCount<2){
    G.vy=-14;G.jumping=true;G.jumpCount++;playSEJump();
    spawnParticles(G.x+G.w/2,G.y,'#FFD700');
  }
  if(e.code==='ArrowDown'){G.crouching=true;playSECrouch();}

  // 隠しコマンド：スペースキー
  if(e.code==='Space'&&state==='playing'){
    triggerSecret();
  }
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='ArrowDown')G.crouching=false;
});

// STARTボタンクリック
ui.addEventListener('click',e=>{
  if(state==='idle'||state==='dead'){
    if(AC.state==='suspended')AC.resume();
    startGame();
  }
});
ui.style.pointerEvents='auto';

// 隠しコマンドをランダム発動
const secrets=['hyperjump','spin','rainbow'];
let lastSecret=-1;
function triggerSecret(){
  // クールダウン中は無視
  if(secretMode)return;
  let idx;
  do{idx=Math.floor(Math.random()*secrets.length);}while(idx===lastSecret);
  lastSecret=idx;
  secretMode=secrets[idx];
  secretTimer=120; // 2秒

  if(secretMode==='hyperjump'){
    G.vy=-22;G.jumping=true;G.jumpCount=2;
    playSESecret();
    spawnParticles(G.x+G.w/2,G.y,'#FFD700',20);
    spawnParticles(G.x+G.w/2,G.y,'#FF80FF',20);
    showSecretMsg('🚀 HYPER JUMP!!');
  } else if(secretMode==='spin'){
    playSESpin();
    showSecretMsg('💫 SPIN!!');
  } else if(secretMode==='rainbow'){
    playSESecret();
    showSecretMsg('🌈 RAINBOW MODE!!');
  }
}

// 隠しコマンドメッセージ
let secretMsg='',secretMsgTimer=0;
function showSecretMsg(msg){secretMsg=msg;secretMsgTimer=90;}

function startGame(){
  state='playing';score=0;frame=0;speed=4;milestone1000=0;milestone5000Done=false;
  obstacles=[];clouds=[];particles=[];sunY=50;
  secretMode=null;secretTimer=0;spinAngle=0;secretMsg='';secretMsgTimer=0;
  G.y=GROUND;G.vy=0;G.jumping=false;G.crouching=false;G.jumpCount=0;
  ui.style.display='none';
  startBGM(false);loop();
}

function getDifficulty(){
  const lv=Math.floor(score/1000);
  return{speed:Math.min(4+lv*0.8,12),interval:Math.max(40,90-lv*8),maxObstacles:Math.min(2+Math.floor(lv/2),5)};
}

function spawnParticles(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col});
  }
}

function spawnObstacle(){
  const diff=getDifficulty();
  if(obstacles.filter(o=>o.x>0).length>=diff.maxObstacles)return;
  const r=Math.random();
  const isDaibutsu=Math.random()<0.15;
  // レア回転大仏：5%の確率
  const isSpinDaibutsu=!isDaibutsu&&Math.random()<0.05;
  if(r<0.35){
    const h=40+Math.random()*30;
    obstacles.push({type:'cactus',x:W+20,y:GROUND,w:28,h,daibutsu:isDaibutsu,spinDaibutsu:isSpinDaibutsu,spinAngle:0});
  } else if(r<0.7){
    const yOpts=[GROUND-65,GROUND-110,GROUND-150];
    const y=yOpts[Math.floor(Math.random()*yOpts.length)];
    obstacles.push({type:'bird',x:W+20,y,w:44,h:28,wing:0,daibutsu:isDaibutsu,spinDaibutsu:isSpinDaibutsu,spinAngle:0});
  } else {
    obstacles.push({type:'rock',x:W+20,y:GROUND,w:36,h:30,daibutsu:false,spinDaibutsu:false,spinAngle:0});
  }
}
function spawnCloud(){clouds.push({x:W+60,y:30+Math.random()*70,w:80+Math.random()*50,h:28});}

function collides(o){
  if(secretMode==='spin')return false; // スピン中は無敵！
  const pad=7;
  const ax1=G.x+pad,ax2=G.x+G.w-pad,ay1=G.y-G.h+pad,ay2=G.y-pad;
  let bx1,bx2,by1,by2;
  if(o.type==='bird'){bx1=o.x+6;bx2=o.x+o.w-6;by1=o.y+4;by2=o.y+o.h-4;}
  else{bx1=o.x+pad;bx2=o.x+o.w-pad;by1=o.y-o.h+pad;by2=o.y-pad;}
  return ax1<bx2&&ax2>bx1&&ay1<by2&&ay2>by1;
}

// ===== SKY =====
function getSkyColors(){
  const t=Math.min(score/4000,1);
  function lerp(a,b,t){
    const ar=parseInt(a.slice(1,3),16),ag=parseInt(a.slice(3,5),16),ab=parseInt(a.slice(5,7),16);
    const br=parseInt(b.slice(1,3),16),bg=parseInt(b.slice(3,5),16),bb=parseInt(b.slice(5,7),16);
    return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
  }
  const t1=Math.min(t*2,1),t2=Math.max(t*2-1,0);
  return{
    top:t<0.5?lerp('#87CEEB','#FF6030',t1):lerp('#FF6030','#0A0020',t2),
    bot:t<0.5?lerp('#C8E8F5','#FF9060',t1):lerp('#FF9060','#1A0A40',t2),
    sunAlpha:Math.max(0,1-t*1.5),starAlpha:Math.max(0,t*2-1)
  };
}
function drawSky(){
  const sky=getSkyColors();
  // レインボーモード時は虹色空
  if(secretMode==='rainbow'){
    rainbowHue=(rainbowHue+2)%360;
    const gr=ctx.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,`hsl(${rainbowHue},80%,60%)`);
    gr.addColorStop(0.5,`hsl(${(rainbowHue+120)%360},80%,60%)`);
    gr.addColorStop(1,`hsl(${(rainbowHue+240)%360},80%,60%)`);
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  } else {
    const gr=ctx.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,sky.top);gr.addColorStop(1,sky.bot);
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
  if(sky.starAlpha>0&&secretMode!=='rainbow'){
    ctx.save();ctx.globalAlpha=sky.starAlpha;ctx.fillStyle='white';
    [[60,20],[120,35],[200,15],[300,40],[420,18],[520,30],[580,12],[80,50],[350,25]].forEach(([sx,sy])=>{
      ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }
  sunY=50+Math.min(score/4000,1)*140;
  ctx.save();ctx.globalAlpha=sky.sunAlpha*0.7;
  ctx.fillStyle=`rgba(255,${Math.round(224-Math.min(score/4000,1)*200)},64,1)`;
  ctx.beginPath();ctx.arc(W-60,sunY,28,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=sky.sunAlpha*0.25;ctx.beginPath();ctx.arc(W-60,sunY,42,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(sky.starAlpha>0&&secretMode!=='rainbow'){
    ctx.save();ctx.globalAlpha=sky.starAlpha;
    ctx.fillStyle='#FFFDE0';ctx.beginPath();ctx.arc(80,40,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=sky.top;ctx.beginPath();ctx.arc(90,36,15,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function drawGround(){
  const t=Math.min(score/4000,1);
  ctx.fillStyle=`rgb(${Math.round(194-t*60)},${Math.round(163-t*60)},${Math.round(90-t*40)})`;
  ctx.fillRect(0,GROUND,W,H-GROUND+60);
  ctx.fillStyle='#A8864A';ctx.fillRect(0,GROUND,W,4);
  ctx.fillStyle=t>0.7?'rgba(80,60,20,0.8)':'#7DB33A';
  for(let i=0;i<W;i+=18){
    const xo=((frame*speed*0.5)|0+i*18)%W;
    ctx.beginPath();ctx.moveTo(xo,GROUND);ctx.lineTo(xo+4,GROUND-7);ctx.lineTo(xo+8,GROUND);ctx.fill();
  }
}
function drawCloud(cl){
  ctx.save();ctx.globalAlpha=0.82;ctx.fillStyle='white';
  ctx.beginPath();ctx.ellipse(cl.x,cl.y,cl.w/2,cl.h/2,0,0,Math.PI*2);
  ctx.ellipse(cl.x+cl.w*0.2,cl.y-cl.h*0.3,cl.w*0.35,cl.h*0.45,0,0,Math.PI*2);
  ctx.ellipse(cl.x-cl.w*0.2,cl.y-cl.h*0.2,cl.w*0.3,cl.h*0.4,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
}

// ===== GIRAFFE =====
function drawGiraffe(){
  const gx=G.x,gy=G.y,cr=G.crouching;
  const legH=cr?18:30,bodyH=cr?22:28,bodyW=cr?50:38;
  const neckH=cr?12:38,neckW=10,headW=cr?22:18,headH=cr?12:16;

  ctx.save();

  // スピン：キリン中心に回転
  if(secretMode==='spin'){
    spinAngle+=0.25;
    ctx.translate(gx+G.w/2,gy-G.h/2);
    ctx.rotate(spinAngle);
    ctx.translate(-(gx+G.w/2),-(gy-G.h/2));
    // スピン中は星エフェクト
    if(frame%4===0)spawnParticles(gx+G.w/2,gy-G.h/2,`hsl(${Math.random()*360},100%,70%)`,3);
  }

  // レインボーモード：キリンが虹色に光る
  if(secretMode==='rainbow'){
    ctx.shadowColor=`hsl(${(frame*5)%360},100%,60%)`;
    ctx.shadowBlur=20;
    if(frame%3===0)spawnParticles(gx+Math.random()*G.w,gy-Math.random()*G.h,`hsl(${Math.random()*360},100%,70%)`,2);
  }

  // ハイパージャンプ中：後ろにジェット炎
  if(secretMode==='hyperjump'&&G.jumping){
    if(frame%2===0){
      spawnParticles(gx+G.w/2,gy,`hsl(${20+Math.random()*40},100%,60%)`,3);
    }
  }

  if(!cr){
    const sw=Math.sin(frame*0.3)*8;
    [[gx+2,0],[gx+bodyW-12,0],[gx+8,sw*0.04],[gx+bodyW-6,-sw*0.04]].forEach(([lx,rot],i)=>{
      ctx.save();ctx.translate(lx+(i>1?4:0),gy-2);ctx.rotate(rot);
      ctx.fillStyle='#D4A840';ctx.fillRect(0,-legH+2,7,legH);
      ctx.fillStyle='#7A5020';ctx.fillRect(0,-6,8,6);ctx.restore();
    });
  } else {
    ctx.fillStyle='#D4A840';ctx.fillRect(gx+4,gy-legH,8,legH);ctx.fillRect(gx+bodyW-14,gy-legH,8,legH);
    ctx.fillStyle='#7A5020';ctx.fillRect(gx+4,gy-6,9,6);ctx.fillRect(gx+bodyW-14,gy-6,9,6);
  }
  const byY=gy-legH-bodyH;
  ctx.fillStyle='#E8C060';ctx.beginPath();ctx.roundRect(gx,byY,bodyW,bodyH,10);ctx.fill();
  ctx.fillStyle='#C8903A';
  [[gx+10,byY+6,8,7],[gx+24,byY+10,9,7],[gx+5,byY+16,7,6]].forEach(([x,y,w,h])=>{
    ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0.3,0,Math.PI*2);ctx.fill();
  });
  const nx=gx+bodyW-neckW-4,ny=byY-neckH;
  ctx.fillStyle='#E8C060';
  ctx.beginPath();ctx.moveTo(nx,byY);ctx.lineTo(nx+neckW,byY);ctx.lineTo(nx+neckW+4,ny);ctx.lineTo(nx-2,ny);ctx.closePath();ctx.fill();
  ctx.fillStyle='#C8903A';
  ctx.beginPath();ctx.ellipse(nx+4,ny+10,4,3,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(nx+5,ny+22,3,2.5,0.3,0,Math.PI*2);ctx.fill();
  const hx=nx-2,hy=ny-headH;
  ctx.fillStyle='#E8C060';ctx.beginPath();ctx.roundRect(hx,hy,headW,headH,5);ctx.fill();
  ctx.fillStyle='#9A6820';ctx.fillRect(hx+3,hy-8,4,8);ctx.fillRect(hx+10,hy-6,4,7);
  ctx.fillStyle='#C8903A';ctx.beginPath();ctx.arc(hx+5,hy-8,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+12,hy-6,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2C1A0E';ctx.beginPath();ctx.arc(hx+headW-4,hy+5,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(hx+headW-3,hy+4,1.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2C1A0E';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(hx+headW-4,hy+2);ctx.lineTo(hx+headW-2,hy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(hx+headW-4,hy+2);ctx.lineTo(hx+headW,hy+1);ctx.stroke();
  ctx.fillStyle='#C8903A';ctx.beginPath();ctx.ellipse(hx+headW-3,hy+10,4,3,0,0,Math.PI*2);ctx.fill();
  const tw=Math.sin(frame*0.2)*6;
  ctx.strokeStyle='#D4A840';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(gx+2,byY+6);ctx.quadraticCurveTo(gx-10,byY+16+tw,gx-6,byY+26+tw);ctx.stroke();
  ctx.fillStyle='#7A5020';ctx.beginPath();ctx.arc(gx-6,byY+26+tw,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ===== 大仏（シンプル線画）=====
function drawDaibutsu(x,y,scale=1,flying=false,colorSet=null){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  const bob=flying?Math.sin(frame*0.15)*4:0;
  const lw=2.2;
  const cs=colorSet||daibutsuColors[0];
  const lc=cs.lc,fc=cs.fc,sc=cs.sc;

  if(flying){
    ctx.save();ctx.globalAlpha=0.25+Math.sin(frame*0.1)*0.08;
    ctx.strokeStyle='#B8A060';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(0,-58+bob,30,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.12;ctx.beginPath();ctx.arc(0,-58+bob,38,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle=lc;ctx.lineWidth=lw;
  ctx.fillStyle=fc;
  for(let i=0;i<7;i++){
    const a=-Math.PI+i/6*Math.PI,cx2=Math.cos(a)*20,cy2=12+Math.sin(a)*5;
    ctx.beginPath();ctx.ellipse(cx2,cy2,8,5,a,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle=fc;ctx.beginPath();ctx.ellipse(0,6,22,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=fc;
  ctx.beginPath();
  ctx.moveTo(-22,-2+bob);ctx.quadraticCurveTo(-26,8+bob,0,14+bob);
  ctx.quadraticCurveTo(26,8+bob,22,-2+bob);ctx.quadraticCurveTo(18,-28+bob,0,-34+bob);
  ctx.quadraticCurveTo(-18,-28+bob,-22,-2+bob);
  ctx.fill();ctx.stroke();
  ctx.lineWidth=lw*0.7;
  ctx.beginPath();ctx.moveTo(-4,-32+bob);ctx.quadraticCurveTo(-14,-10+bob,-18,10+bob);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,-32+bob);ctx.quadraticCurveTo(14,-10+bob,18,10+bob);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,-28+bob);ctx.quadraticCurveTo(0,-22+bob,8,-28+bob);ctx.stroke();
  ctx.lineWidth=lw;
  ctx.fillStyle=fc;
  ctx.beginPath();ctx.ellipse(-10,0+bob,9,6,0.2,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.lineWidth=lw*0.6;
  [-14,-11,-8,-5].forEach((hx2,i)=>{ctx.beginPath();ctx.moveTo(hx2,-2+bob);ctx.lineTo(hx2-1,-8+bob+i*0.5);ctx.stroke();});
  ctx.lineWidth=lw;
  ctx.fillStyle=fc;ctx.beginPath();ctx.ellipse(12,-8+bob,7,9,0.1,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.lineWidth=lw*0.6;
  [8,11,14,17].forEach((hx2,i)=>{ctx.beginPath();ctx.moveTo(hx2,-4+bob);ctx.lineTo(hx2,-13+bob+i*0.3);ctx.stroke();});
  ctx.lineWidth=lw;
  ctx.fillStyle=fc;ctx.beginPath();ctx.roundRect(-8,-46+bob,16,14,3);ctx.fill();ctx.stroke();
  ctx.lineWidth=lw*0.6;
  [-44,-41].forEach(yy=>{ctx.beginPath();ctx.moveTo(-7,yy+bob);ctx.lineTo(7,yy+bob);ctx.stroke();});
  ctx.lineWidth=lw;
  ctx.fillStyle=fc;ctx.beginPath();ctx.ellipse(0,-62+bob,19,21,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=fc;ctx.beginPath();ctx.ellipse(0,-83+bob,10,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=sc;
  const hairRows=[

// 各大仏インスタンスのカラーを固定

function getColorFor(o){
  if(!obstacleColor.has(o)){

// ===== 吹き出し =====
function drawBubble(x,y,text,col='#886600'){
  ctx.save();
  ctx.font='bold 14px Arial Black';
  const pw=ctx.measureText(text).width+18,ph=26;
  ctx.fillStyle='white';ctx.strokeStyle=col;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.roundRect(x,y-ph,pw,ph,6);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+10,y);ctx.lineTo(x+4,y+8);ctx.lineTo(x+20,y);
  ctx.fillStyle='white';ctx.fill();ctx.strokeStyle=col;ctx.stroke();
  ctx.fillStyle=col;ctx.textBaseline='middle';
  ctx.fillText(text,x+9,y-ph/2);

}

// ===== OBSTACLE =====
function drawObstacle(o){
  if(o.daibutsu){
    const cs=getColorFor(o);
    const phrase=getPhraseFor(o);
    if(o.type==='bird'){
      drawDaibutsu(o.x+22,o.y+20,0.55,true,cs);
      drawBubble(o.x+48,o.y-34,phrase,cs.bubble);
    } else if(o.type==='cactus'){
      drawDaibutsu(o.x+14,o.y-o.h+10,0.65,false,cs);
      drawBubble(o.x+20,o.y-o.h-14,phrase,cs.bubble);
    }
    return;
  }
  // レア回転大仏
  if(o.spinDaibutsu){
    o.spinAngle=(o.spinAngle||0)+0.06;
    const cs=daibutsuColors[1+Math.floor((o.spinAngle*2)%( daibutsuColors.length-1))];
    const cx2=o.type==='bird'?o.x+22:o.x+14;
    const cy2=o.type==='bird'?o.y+20:o.y-( o.h||40)+10;
    const sc2=o.type==='bird'?0.55:0.65;
    ctx.save();
    ctx.translate(cx2,cy2-40*sc2);
    ctx.rotate(o.spinAngle);
    ctx.translate(-cx2,-(cy2-40*sc2));
    drawDaibutsu(cx2,cy2,sc2,o.type==='bird',cs);
    ctx.restore();
    // 虹色オーラ
    ctx.save();ctx.globalAlpha=0.3+Math.sin(o.spinAngle*3)*0.15;
    ctx.strokeStyle=`hsl(${(o.spinAngle*60)%360},100%,60%)`;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(cx2,cy2-40*sc2,36*sc2,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    // 吹き出し
    const phrase2=getPhraseFor(o);
    drawBubble(o.type==='bird'?o.x+48:o.x+20,o.type==='bird'?o.y-34:o.y-(o.h||40)-14,phrase2,cs.bubble);
    // キラキラパーティクル
    if(frame%6===0)spawnParticles(cx2+Math.random()*30-15,cy2-40*sc2+Math.random()*30-15,`hsl(${Math.random()*360},100%,70%)`,2);
    return;
  }
  if(o.type==='cactus'){
    ctx.fillStyle='#3A8C3A';
    ctx.beginPath();ctx.roundRect(o.x+6,o.y-o.h,12,o.h,4);ctx.fill();
    ctx.beginPath();ctx.roundRect(o.x,o.y-o.h*0.6,8,6,3);ctx.fill();
    ctx.beginPath();ctx.roundRect(o.x,o.y-o.h*0.6-12,6,14,3);ctx.fill();
    ctx.beginPath();ctx.roundRect(o.x+16,o.y-o.h*0.45,8,6,3);ctx.fill();
    ctx.beginPath();ctx.roundRect(o.x+20,o.y-o.h*0.45-10,6,12,3);ctx.fill();
    ctx.fillStyle='#2A6A2A';ctx.beginPath();ctx.arc(o.x+12,o.y-o.h,4,0,Math.PI*2);ctx.fill();
  } else if(o.type==='bird'){
    const wy=Math.sin(o.wing)*7;
    ctx.fillStyle='#E85030';ctx.beginPath();ctx.ellipse(o.x+22,o.y+14,16,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF6040';
    ctx.beginPath();ctx.moveTo(o.x+14,o.y+14);ctx.quadraticCurveTo(o.x+6,o.y+wy,o.x,o.y+6+wy);ctx.quadraticCurveTo(o.x+10,o.y+12,o.x+14,o.y+14);ctx.fill();
    ctx.beginPath();ctx.moveTo(o.x+30,o.y+14);ctx.quadraticCurveTo(o.x+40,o.y+wy,o.x+44,o.y+6+wy);ctx.quadraticCurveTo(o.x+34,o.y+12,o.x+30,o.y+14);ctx.fill();
    ctx.fillStyle='#E85030';ctx.beginPath();ctx.arc(o.x+34,o.y+10,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#F5C030';ctx.beginPath();ctx.moveTo(o.x+42,o.y+10);ctx.lineTo(o.x+50,o.y+12);ctx.lineTo(o.x+42,o.y+14);ctx.closePath();ctx.fill();
    ctx.fillStyle='white';ctx.beginPath();ctx.arc(o.x+36,o.y+8,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(o.x+37,o.y+8,1.5,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='#8A8A8A';ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y-o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#AAAAAA';ctx.beginPath();ctx.ellipse(o.x+o.w/2-4,o.y-o.h*0.7,o.w*0.25,o.h*0.2,-0.3,0,Math.PI*2);ctx.fill();
  }
}

  for(let i=0;i<5;i++){const a=Math.PI/5*2*i-Math.PI/2,a2=a+Math.PI/5;i===0?ctx2.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx2.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx2.lineTo(Math.cos(a2)*r*0.4,Math.sin(a2)*r*0.4);}

}

// ===== PARTICLES =====
function updateParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.04;
    if(p.life<=0)return false;
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
    return true;
  });
}

// ===== MAIN LOOP =====
let raf2;
function loop(){
  if(state!=='playing')return;
  cancelAnimationFrame(raf2);
  frame++;
  const diff=getDifficulty();
  speed=diff.speed;

  // 隠しコマンドタイマー
  if(secretMode){
    secretTimer--;
    if(secretTimer<=0){secretMode=null;spinAngle=0;}
  }

  G.h=G.crouching?G.crouchH:G.normalH;
  G.vy+=0.7;G.y+=G.vy;
  if(G.y>=GROUND){G.y=GROUND;G.vy=0;G.jumping=false;G.jumpCount=0;}

  if(frame%diff.interval===0)spawnObstacle();
  if(frame%130===0)spawnCloud();
  obstacles.forEach(o=>{o.x-=speed;if(o.type==='bird')o.wing+=0.18;});
  obstacles=obstacles.filter(o=>{
    const keep=o.x>-80;
    if(!keep){obstaclePhrase.delete(o);obstacleColor.delete(o);}
    return keep;
  });
  clouds.forEach(cl=>cl.x-=0.8);
  clouds=clouds.filter(cl=>cl.x>-120);

  for(const o of obstacles){
    if(collides(o)){
      state='dead';stopBGM();playSEDead();
      if(score>best)best=score;
      spawnParticles(G.x+G.w/2,G.y-G.h/2,'#FF4040',16);
      setTimeout(()=>{
        ui.style.display='block';ui.style.pointerEvents='auto';
        drawResultPanel(false);
      },600);
      break;
    }
  }

  if(score>0&&Math.floor(score/1000)>milestone1000){
    milestone1000=Math.floor(score/1000);playSEScore();
    spawnParticles(W/2,H/2,'#FFD700',20);
  }
  if(score>=5000&&!milestone5000Done){
    milestone5000Done=true;playSE5000();
    spawnParticles(W/2,H/2,'#FF80FF',30);spawnParticles(W/3,H/2,'#FFD700',30);spawnParticles(W*2/3,H/2,'#40FFFF',30);
    setTimeout(()=>startBGM(true),2000);
  }

  score++;
  drawFrame();updateParticles();drawHUD();
  raf2=requestAnimationFrame(loop);
}

function drawFrame(){
  ctx.clearRect(0,0,W,H);
  drawSky();clouds.forEach(drawCloud);drawGround();
  obstacles.forEach(drawObstacle);drawGiraffe();
}
